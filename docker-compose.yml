services:
  commission-program:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - commission-program-data:/app/data
    restart: unless-stopped

volumes:
  commission-program-data:
